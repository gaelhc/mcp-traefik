name: Build Docker Image

on:
  workflow_dispatch:
      # input:
      #   description: 'tag'
      #   required: true
      #   type: string  

  # push:
  #   branches:
  #     - '**' # Run on push to any branch
  # pull_request:
  #   branches:
  #     - 'main' # Run on pull request to main branch

jobs:
  build-and-test:
    runs-on: docker

    steps:
      # Checkout
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract branch name
        id: vars
        run: |
          # Get branch name
          echo 'Extracting branch name:'
          RAW_BRANCH=${{ github.ref_name }}
          echo "$RAW_BRANCH"
          
          # Replace / by - and use lower case
          echo 'Generating tag from branch name:'
          HYPHEN_BRANCH=${RAW_BRANCH//\//-}
          TAGNAME=$(echo "$HYPHEN_BRANCH" | tr '[:upper:]' '[:lower:]')
          echo "$TAGNAME"
          
          # 4. Expose la variable
          echo "tag=${TAGNAME}" >> $GITHUB_OUTPUT

      - name: Login to Forgejo Container Registry
        uses: https://github.com/docker/login-action@v3
        with:
          registry: forge.alpi-lab.fr/
          username: builder
          password: ${{ secrets.BUILDER }}

      - name: Build and Push
        uses: https://github.com/docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: forge.alpi-lab.fr/gael/traefik-mcp:${{ steps.vars.outputs.tag }}
          # tags: forge.alpi-lab.fr/gael/traefik-mcp:${{ inputs.tag }}