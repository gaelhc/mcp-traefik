name: Execute Tests

on:
  workflow_dispatch:
  push:
    branches:
      - '**' # Run on push to any branch
  pull_request:
    branches:
      - 'main' # Run on pull request to main branch

jobs:
  build-and-test:
    runs-on: docker

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Python environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: pytest tests/
